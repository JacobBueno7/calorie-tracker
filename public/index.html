<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Security policy (protects the API key stored on the device):
    - only this site's own script/styles can run (no third-party or inline scripts)
    - network requests may go ONLY to Anthropic, USDA and Open Food Facts,
      so even injected code could not send the key anywhere else
    - images/media only from this site or local camera/photo data
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://api.anthropic.com https://api.nal.usda.gov https://world.openfoodfacts.org; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorie Tracker</title>
  <meta name="theme-color" content="#0f9d58">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calories">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabs">
    <button data-view="diary"><span>📒</span>Diary</button>
    <button data-view="history"><span>📈</span>History</button>
    <button data-view="foods"><span>🏷️</span>My Foods</button>
    <button data-view="settings"><span>⚙️</span>Settings</button>
  </nav>
  <div id="sheets"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
